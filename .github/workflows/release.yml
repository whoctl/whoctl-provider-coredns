name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# One job builds both platforms and uploads once. A matrix job per platform
# raced: two jobs creating the same release at the same moment, and whoever
# lost failed the upload — which with fail-fast cancelled the other and left a
# release missing an architecture. Go cross-compiles for nothing.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build, package and checksum
        env:
          CGO_ENABLED: "0"
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # The tag is v0.2.1 and the version is 0.2.1. The `v` is git's
          # convention for naming a tag, and it is not part of a semantic
          # version — the registry index, the lockfile and the install path all
          # spell it without one. Stamping the tag verbatim made `whoctl
          # providers` report v0.2.1 on the same line as a path saying 0.2.1.
          VERSION=${TAG#v}
          export VERSION
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch make build

            # The name carries no version: GitHub's releases/latest/download/
            # URL only resolves a fixed asset name, and the tag already says
            # which release this is.
            name=whoctl-provider-coredns-linux_$arch
            # The binary by name, not the whole of bin/. Naming the
            # directory is how nine example manifests ended up in every
            # install: whatever a build leaves behind rides along.
            tar -C bin -czf "dist/$name.tar.gz" whoctl-provider-coredns
            # The checksum is what the registry index publishes and what whoctl
            # verifies before it executes anything it downloaded.
            ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )
            rm -rf bin
          done
          # Published once, not per platform: the pages and the schema are the
          # same whatever the binary was built for.
          make docs && mv bundle.json dist/docs-bundle.json
          ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # The site is built centrally, so a release has to tell it there is something
  # new. Without this the site only catches up on its nightly schedule.
  #
  # # Why an App and not a token
  #
  # GITHUB_TOKEN is scoped to the repository running the workflow, so it cannot
  # write to a sibling even inside one organization. A personal access token
  # can — and belongs to a person, who leaves, revokes it, or simply is not the
  # one who should own the release path for a project several people work on.
  #
  # A GitHub App is owned by the organization. It mints a token that lives an
  # hour and does not exist between runs, and nothing about it survives anyone
  # leaving. The App id is not a secret and is an organization *variable*; only
  # the private key is a secret.
  #
  # # Why it asks for Actions and not Contents
  #
  # Triggering a build is all this needs, and `workflow_dispatch` needs
  # `actions: write`. The other way in — `repository_dispatch` — needs
  # `contents: write`, which is the right to edit whoctl-docs: change
  # providers.yaml to name somebody else's repository and the next build signs
  # and publishes that index. The signing key never leaves whoctl-docs, so
  # nobody forges a signature — they get the real one applied to their content.
  # A key that can start a build and change nothing is the smaller thing to
  # lose.
  #
  # With neither set, this says so and the site catches up overnight, which is
  # what the schedule is for.
  notify-docs:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: mint a token from the organization's app
        id: app
        if: vars.WHOCTL_DOCS_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.WHOCTL_DOCS_APP_ID }}
          private-key: ${{ secrets.WHOCTL_DOCS_APP_KEY }}
          owner: whoctl
          repositories: whoctl-docs
          permission-actions: write

      - name: ask whoctl-docs to rebuild
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::No app token, so whoctl-docs was not told."
            echo "Set WHOCTL_DOCS_APP_ID (an organization variable) and"
            echo "WHOCTL_DOCS_APP_KEY (an organization secret) to change that."
            echo "This release becomes installable on the site's next nightly build."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/whoctl/whoctl-docs/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}'
          echo "whoctl-docs asked to rebuild."
